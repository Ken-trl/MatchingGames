<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team Connect Memory Game</title>
</head>
<body>
    <!-- HTML SECTION -->
    <div class="game-container">
        <div class="header">
            <h1 class="title">🎯 Team Connect</h1>
            <p class="subtitle">Memory Game Ice Breaker</p>
        </div>

        <div class="game-stats">
            <div class="stat">
                <span class="stat-number" id="moves">0</span>
                <span class="stat-label">Moves</span>
            </div>
            <div class="stat">
                <span class="stat-number" id="matches">0</span>
                <span class="stat-label">Matches</span>
            </div>
            <div class="stat">
                <span class="stat-number" id="time">0:00</span>
                <span class="stat-label">Time</span>
            </div>
        </div>

        <div class="game-board" id="gameBoard"></div>

        <div class="controls">
            <button class="btn" onclick="resetGame()">🔄 New Game</button>
            <button class="btn" onclick="showHint()">💡 Hint</button>
        </div>
    </div>

    <div class="celebration" id="celebration">
        <h2>🎉 Fantastic!</h2>
        <p>You found all the matches! Great job connecting with your team!</p>
        <button class="btn" onclick="hideCelebration()">Continue</button>
    </div>
